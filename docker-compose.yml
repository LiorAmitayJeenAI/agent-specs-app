version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: agent-specs-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_spec_form
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
